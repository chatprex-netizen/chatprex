version: '3.8'

services:
  # Base de Datos PostgreSQL
  pgsql:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: '${DB_DATABASE:-krayin_crm}'
      POSTGRES_USER: '${DB_USERNAME:-krayin_user}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - krayin-pgsql:/var/lib/postgresql/data
    networks:
      - krayin-net

  # Aplicación Unificada (Frontend React + Backend Express API)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USERNAME:-krayin_user}:${DB_PASSWORD:-secret}@pgsql:5432/${DB_DATABASE:-krayin_crm}
      - JWT_SECRET=${JWT_SECRET:-krayin_super_secret_jwt_key_change_in_production_2024}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-d3b07384d113edec49eaa6238ad5ff00b7983637184711311029837198762512}
    networks:
      - krayin-net
    depends_on:
      - pgsql

networks:
  krayin-net:
    driver: bridge

volumes:
  krayin-pgsql:
    driver: local
